<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — MARIS &amp; CATCH</title>
  <meta name="description" content="Something fresh is on the way. The new MARIS & CATCH experience launches soon — join the list for early access.">
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="../../src/css/pages.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('maris-theme');
        if (!t) { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        var d = localStorage.getItem('maris-dir');
        if (d === 'rtl' || (!d && /^(ar|he|fa|ur|ps|sd)/i.test(navigator.language || ''))) document.documentElement.setAttribute('dir', 'rtl');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <main>
    <!-- 1. HERO -->
    <section class="coming-soon-hero" style="min-height: 100vh;">
      <div class="container coming-soon-inner">
        <span class="eyebrow eyebrow-light">Launching Soon</span>
        <h1 class="coming-soon-title">Something Fresh Is Surfacing</h1>
        <p class="coming-soon-sub">We’re rebuilding the MARIS &amp; CATCH experience from the hull up — faster ordering, smarter subscriptions, and a live catch map. Be the first to dive in.</p>

        <div class="countdown countdown--lg" data-countdown="2026-11-15T10:00:00">
          <div class="cd-unit"><span data-cd-days>00</span><small>Days</small></div>
          <div class="cd-unit"><span data-cd-hours>00</span><small>Hours</small></div>
          <div class="cd-unit"><span data-cd-mins>00</span><small>Minutes</small></div>
          <div class="cd-unit"><span data-cd-secs>00</span><small>Seconds</small></div>
        </div>

        <form id="newsletterForm" class="coming-soon-form" novalidate>
          <div class="newsletter-field">
            <input type="email" id="newsletterEmail" name="email" placeholder="Enter your email for early access" aria-label="Email address" required>
            <button type="submit" class="btn btn-ocean">Notify Me</button>
          </div>
          <span class="field-error" data-error-for="newsletterEmail"></span>
        </form>
      </div>
    </section>
  </main>

  <script src="../../src/js/theme.js"></script>
  <script src="../../src/js/ui.js"></script>
  <script src="../../src/js/form-validation.js"></script>
</body>
</html>
