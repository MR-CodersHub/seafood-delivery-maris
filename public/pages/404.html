<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — MARIS &amp; CATCH</title>
  <meta name="description" content="The page you were looking for slipped off the hook. Head back to the harbor and find today's catch.">
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="../../src/css/pages.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('maris-theme');
        if (!t) { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        var d = localStorage.getItem('maris-dir');
        if (d === 'rtl' || (!d && /^(ar|he|fa|ur|ps|sd)/i.test(navigator.language || ''))) document.documentElement.setAttribute('dir', 'rtl');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <main>
    <!-- 1. HERO -->
    <section class="error-hero" style="min-height: 100vh;">
      <div class="container error-hero-inner">
        <div class="error-code">404</div>
        <h1 class="error-title">This Page Slipped Off the Hook</h1>
        <p class="error-sub">The link may be broken, or the page may have been moved to a different harbor. Let’s get you back to calm waters.</p>
        <div class="flex-wrap" style="justify-content:center;margin-top:8px;">
          <a href="../../index.html" class="btn btn-ocean">Back to Home</a>
          <a href="../../index.html#catch" class="btn btn-secondary">Shop Today’s Catch</a>
        </div>
      </div>
    </section>
  </main>
  
  <script src="../../src/js/theme.js"></script>
  <script src="../../src/js/ui.js"></script>
  <script src="../../src/js/form-validation.js"></script>
</body>
</html>
